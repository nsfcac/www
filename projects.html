  <script>
    $(function () {
      $("#header").load("common/header.html");
      $("#footer").load("common/footer.html");
      AOS.init();
      loadProjects();
    });

    function loadProjects() {
  $.getJSON("projects.json", function (data) {
    let projectSection = $('.paper-list');

    // Create Current Projects section
    projectSection.append('<h2>Current Projects</h2>');
    data.currentProjects.forEach(semester => {
      projectSection.append(`<h3>${semester.semester}:</h3>`);
      createProjectTable(projectSection, semester.projects, semester.semester);
    });

    // Create Past Projects section
    projectSection.append('<h2>Past Projects</h2>');
    data.pastProjects.forEach(semester => {
      projectSection.append(`<h3>${semester.semester}:</h3>`);
      createProjectTable(projectSection, semester.projects, semester.semester);
    });
  });
}

function createProjectTable(container, projects, semester) {
  let semesterId = semester.trim()
  let table = `<table class="table table-condensed table-striped">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Project ID</th>
                    <th>Project Description</th>
                    <th>Led By</th>
                  </tr>
                </thead>
                <tbody>`;
  projects.forEach((project, index) => {
    let projectId = project.id;
    let title = project.title;
    let leader = project.leader;
    let description = project.description;
    let collapseId = `${semester}_${projectId}collapse`;
    
    table += `<tr class="accordion-toggle" data-toggle="collapse" data-target="#${collapseId}" aria-expanded="false">
                <th scope="row">${index + 1}</th>
                <td>${projectId}</td>
                <td><a>${title}</a></td>
                <td>${leader}</td>
              </tr>
              <tr>
                <td class="hiddenRow" colspan="4" style="padding: 0px">
                  <div class="accordion-body collapse" id="${collapseId}">
                    ${description}
                  </div>
                </td>
              </tr>`;
  });
  
  table += `</tbody></table>`;
  container.append(table);
}
